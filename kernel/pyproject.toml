[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amnesia-agent-kernel"
version = "0.0.0a0"
description = "A minimal, frontend-agnostic self-directed agent kernel."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.15"
# LiteLLM 1.98+ imports typing.NotRequired during module initialization, but
# typing.NotRequired is only available in Python 3.11+. Keep Python 3.10 support
# on a version that uses the typing_extensions backport instead.
dependencies = ["litellm==1.97.0"]

[tool.setuptools]
packages = ["amnesia_agent_kernel", "amnesia_agent_kernel.workspace"]

[tool.setuptools.package-data]
"amnesia_agent_kernel" = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.mypy]
files = ["amnesia_agent_kernel"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = ["litellm", "litellm.*"]
ignore_missing_imports = true
follow_imports = "skip"
