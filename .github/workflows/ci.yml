name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      kernel: ${{ steps.select.outputs.kernel }}
      server: ${{ steps.select.outputs.server }}
      renpy_client: ${{ steps.select.outputs.renpy_client }}
      workflows: ${{ steps.select.outputs.workflows }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          filters: |
            kernel:
              - 'kernel/**'
            server:
              - 'server/**'
            renpy_client:
              - 'renpy-client/**'
              - 'cmd/local-renpy-launcher/**'
            workflows:
              - '.github/workflows/**'
      - id: select
        shell: bash
        run: |
          set -euo pipefail
          force_all=false
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.ref }}" == refs/tags/* ]]; then
            force_all=true
          fi

          set_out() {
            local name="$1"
            local value="$2"
            echo "${name}=${value}" >> "$GITHUB_OUTPUT"
          }

          if [[ "$force_all" == "true" ]]; then
            set_out kernel true
            set_out server true
            set_out renpy_client true
            set_out workflows true
            exit 0
          fi

          kernel="${{ steps.filter.outputs.kernel }}"
          server="${{ steps.filter.outputs.server }}"
          renpy_client="${{ steps.filter.outputs.renpy_client }}"
          workflows="${{ steps.filter.outputs.workflows }}"

          # Workflow edits should still validate kernel CI paths at minimum.
          if [[ "$workflows" == "true" ]]; then
            kernel=true
          fi

          set_out kernel "$kernel"
          set_out server "$server"
          set_out renpy_client "$renpy_client"
          set_out workflows "$workflows"

  kernel-lint:
    needs: changes
    if: needs.changes.outputs.kernel == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ./kernel ruff mypy
      - working-directory: kernel
        run: ruff check .
      - working-directory: kernel
        run: mypy

  server-lint:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ./kernel ./server ruff mypy
      - working-directory: server
        run: ruff check .
      - working-directory: server
        run: mypy

  kernel-test:
    needs: changes
    if: needs.changes.outputs.kernel == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ./kernel
      - working-directory: kernel
        run: python -m unittest discover -t . -s tests -v

  server-test:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ./kernel ./server
      - working-directory: server
        run: python -m unittest discover -t . -s tests -v

  renpy-client-test:
    needs: changes
    if: needs.changes.outputs.renpy_client == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - working-directory: renpy-client
        run: python -m unittest discover -t . -s tests -v

  kernel-build:
    needs: changes
    if: >-
      needs.changes.outputs.kernel == 'true'
      || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build kernel --outdir dist/kernel
      - run: python -m pip install --no-cache-dir dist/kernel/*.whl
      - run: python -c "import amnesia_agent_kernel"
      - uses: actions/upload-artifact@v7
        with:
          name: python-kernel-dist
          path: dist/kernel
          if-no-files-found: error

  server-build:
    needs: [changes, kernel-build]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: python-kernel-dist
          path: dist/kernel
      - run: python -m pip install --upgrade build
      - run: python -m pip install --no-cache-dir --find-links dist/kernel amnesia-agent-kernel==0.0.0a0
      - run: python -m build server --outdir dist/server
      - run: python -m pip install --no-cache-dir --find-links dist/kernel dist/server/*.whl
      - run: python -c "import amnesia_agent_server"
      - uses: actions/upload-artifact@v7
        with:
          name: python-server-dist
          path: dist/server
          if-no-files-found: error

  server-native-build:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-amd64
          - os: windows-latest
            suffix: windows-amd64
          - os: macos-13
            suffix: macos-amd64
          - os: macos-14
            suffix: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ./kernel ./server pyinstaller
      - shell: bash
        run: >-
          python -m PyInstaller --onefile --name amnesia-agent-server
          --paths kernel --paths server
          --collect-submodules fastapi --collect-submodules uvicorn
          --collect-submodules amnesia_agent_kernel
          server/amnesia_agent_server/__main__.py
      - uses: actions/upload-artifact@v7
        with:
          name: server-native-${{ matrix.suffix }}
          path: dist/amnesia-agent-server*
          if-no-files-found: error

  local-renpy-launcher-build:
    needs: changes
    if: needs.changes.outputs.renpy_client == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            binary: local-renpy-launcher.exe
          - goos: darwin
            goarch: amd64
            suffix: macos-amd64
            binary: local-renpy-launcher
          - goos: darwin
            goarch: arm64
            suffix: macos-arm64
            binary: local-renpy-launcher
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            binary: local-renpy-launcher
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - working-directory: cmd/local-renpy-launcher
        run: go test ./...
      - working-directory: cmd/local-renpy-launcher
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "../../local-renpy-launcher-${{ matrix.suffix }}/${{ matrix.binary }}" .
      - uses: actions/upload-artifact@v7
        with:
          name: local-renpy-launcher-${{ matrix.suffix }}
          path: local-renpy-launcher-${{ matrix.suffix }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - changes
      - kernel-lint
      - server-lint
      - kernel-test
      - server-test
      - renpy-client-test
      - kernel-build
      - server-build
      - server-native-build
      - local-renpy-launcher-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Python kernel artifact
        uses: actions/download-artifact@v8
        with:
          name: python-kernel-dist
          path: release-assets/kernel
      - name: Download Python server artifact
        uses: actions/download-artifact@v8
        with:
          name: python-server-dist
          path: release-assets/server
      - name: Download native server artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: server-native-*
          path: release-assets/native-server
          merge-multiple: false
      - name: Download launcher artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: local-renpy-launcher-*
          path: release-assets/launchers
          merge-multiple: false
      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/release-assets"
          zip -qr python-kernel-dist.zip kernel
          zip -qr python-server-dist.zip server
          zip -qr local-renpy-launchers.zip launchers
          zip -qr native-servers.zip native-server
          ls -l
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Amnesia Agent ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/python-kernel-dist.zip
            release-assets/python-server-dist.zip
            release-assets/local-renpy-launchers.zip
            release-assets/native-servers.zip
